<!DOCTYPE html>
<html>
<head>
    <title>Create Drive</title>
</head>
<body>

<div style="background-color:rgb(62,225,225); height:100px; text-align:center; display:flex; justify-content:center; align-items:center;">
    <h1>Placement Portal Application</h1>
</div>

<br><br>

<center>
<div style="border:2px solid black; width:500px; padding:30px; background-color:beige;">

    <h2>Create Placement Drive</h2>

    <form method="POST" action="/company/createdrive" style="line-height:30px;">

        Job Title:<br>
        <input type="text" name="job_title" required><br>

        Description:<br>
        <textarea name="description"></textarea><br>

        Eligibility:<br>
        <input type="text" name="eligibility"><br>

        Deadline:<br>
        <input type="date" name="deadline"><br><br>

        <input type="submit" value="Create Drive">

    </form>

</div>
</center>
<div>
    <center>
        <a href="/company/dashboard">Back</a>
    </center>
</div>
</body>
</html>
