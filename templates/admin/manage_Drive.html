<!DOCTYPE html>
<html>
<head>
    <title>Manage Drives</title>
</head>
<body>
<div style="background-color:rgb(62,225,225); height:100px; text-align:center; display:flex; justify-content:center; align-items:center;">
    <h1>Placement Portal Application</h1>
</div>
<h2 style="text-align:center;">Manage Placement Drives</h2>

<table border="1" align="center" cellpadding="10">
<tr>
<th>ID</th>
<th>Job Title</th>
<th>Eligibility</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for drive in drives %}

<tr>
<td>{{ drive[0] }}</td>
<td>{{ drive[2] }}</td>
<td>{{ drive[4] }}</td>
<td>{{ drive[6] }}</td>

<td>
<a href="/admin/approve_drive/{{ drive[0] }}">Approve</a>
<a href="/admin/reject_drive/{{ drive[0] }}">Reject</a>
<a href="/admin/delete_drive/{{ drive[0] }}">Delete</a>
</td>

</tr>



{% endfor %}

</table>
<div>
    <center>
        <a href="/admin/dashboard">Back</a>
    </center>
</div>
</body>
</html>
